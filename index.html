<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#24272D">
<meta name="description" content="ロジカルシンキングの思考ノートとドリル">
<title>ロジトレ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<!-- ロジトレ 試作版(検討中・ver未確定) -->
<style>
:root{--ac:#378ADD;--kb:0px;--r:8px;--mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1);--spring:cubic-bezier(.34,1.4,.64,1)}
[data-theme=light]{--bg:#ECEEF2;--bg2:#FFFFFF;--bg3:#F3F4F7;--tx:#262A31;--sub:#6A717E;--ln:#E0E3E8;--ln2:#C8CDD5;--inv:#FFFFFF;--dg:#C73B3A;--scrim:rgba(20,24,32,.35);color-scheme:light}
[data-theme=dark]{--bg:#1A1C21;--bg2:#24272D;--bg3:#2D3038;--tx:#DDE0E6;--sub:#959BA7;--ln:#32363E;--ln2:#454A54;--inv:#1A1C21;--dg:#E5534B;--scrim:rgba(0,0,0,.55);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-feature-settings:"palt";overscroll-behavior-y:contain}
body{min-height:100dvh;line-height:1.6}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);letter-spacing:.02em}
.ic{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.b{stroke-width:2.8}
.view{display:none;max-width:760px;margin:0 auto;min-height:100dvh;padding-bottom:calc(7rem + env(safe-area-inset-bottom))}
.view.on{display:block}
#v-editor.view{max-width:1240px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.15rem;padding:calc(.5rem + env(safe-area-inset-top)) .75rem .5rem;background:var(--bg)}
.ib{width:2.6rem;height:2.6rem;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--tx);flex:none}
.ib[aria-disabled=true]{opacity:.3}
.brand{font-size:.72rem;color:var(--sub);margin-left:.4rem;flex:1}
.ttl{font-size:1rem;font-weight:500;margin-left:.3rem;flex:1}
.sp{flex:1}
.hero{display:flex;align-items:baseline;gap:.6rem;padding:1.1rem 1.25rem .2rem}
.hero h1{font-size:1.9rem;font-weight:500;margin:0;letter-spacing:-.01em}
.cnt{font-size:.8rem;color:var(--sub)}
.notice{display:flex;align-items:center;gap:.5rem;width:calc(100% - 2.5rem);margin:.6rem 1.25rem 0;padding:.65rem 0;border-top:.5px solid var(--ln);border-bottom:.5px solid var(--ln);font-size:.78rem;color:var(--sub);text-align:left}
.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.dcard{display:block;width:calc(100% - 2.5rem);margin:0 1.25rem;padding:.9rem 0;border-bottom:.5px solid var(--ln);text-align:left}
.dcard .r1{display:flex;align-items:baseline;font-size:.85rem}
.dcard .r1 span:last-child{margin-left:auto;font-size:.75rem;color:var(--sub)}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:.6rem}
.segs i{height:3px;border-radius:2px;background:var(--ln2)}
.segs i.ok{background:var(--ac)}.segs i.ng{background:var(--sub)}
.tabs{display:flex;padding:.4rem 1.25rem 0;gap:1.2rem}
.tab{padding:.5rem 0;font-size:.85rem;color:var(--sub);border-bottom:1.5px solid transparent}
.tab.on{color:var(--tx);border-bottom-color:var(--tx)}
.subrow{display:flex;justify-content:space-between;align-items:center;padding:.4rem 1.25rem;font-size:.72rem;color:var(--sub);border-top:.5px solid var(--ln)}
.subrow button{display:flex;align-items:center;gap:.25rem;color:var(--sub);padding:.3rem 0}
.subrow .ic{width:1rem;height:1rem}
.list{padding:0 1.25rem}
.row{position:relative;border-bottom:.5px solid var(--ln);overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.sw-c{position:relative;z-index:1;display:flex;align-items:center;gap:.9rem;padding:1rem 0;background:var(--bg);width:100%;text-align:left;transition:transform .28s var(--ease)}
.sw-a{position:absolute;top:0;bottom:0;right:0;display:flex}
.sw-a button{width:70px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--bg3)}
.sw-a button.del{background:var(--dg);color:#fff}
.num{font-size:.7rem;color:var(--sub);width:1.2rem;flex:none}
.rmain{flex:1;min-width:0}
.rtitle{font-size:.97rem;display:flex;align-items:center;gap:.35rem}
.rtitle .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtitle .ic{width:.9rem;height:.9rem;color:var(--ac)}
.meta{font-size:.68rem;color:var(--sub);display:flex;align-items:center;gap:.45rem;margin-top:.3rem;flex-wrap:wrap}
.st{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.st.draft{border:1px solid var(--sub)}.st.wip{background:var(--ac)}.st.done{background:var(--tx)}
.enter{opacity:0;translate:0 6px;animation:up .32s var(--ease) forwards}
@keyframes up{to{opacity:1;translate:0 0}}
.fab{position:fixed;right:calc(1.25rem + env(safe-area-inset-right));bottom:calc(1.25rem + env(safe-area-inset-bottom));width:3.3rem;height:3.3rem;border-radius:14px;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;z-index:30;transition:transform .2s var(--spring)}
.fab:active{transform:scale(.9)}
.fab .ic{width:1.5rem;height:1.5rem}
@media(min-width:800px){.fab{right:calc(50% - 380px + 1.25rem)}}
.empty{padding:2.5rem 0}
.empty h3{font-weight:500;font-size:1.05rem;margin:0 0 .3rem}
.empty p{color:var(--sub);font-size:.85rem;margin:0 0 1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.6rem;padding:0 1rem;border-radius:var(--r);border:.5px solid var(--ln2);font-size:.88rem;background:var(--bg2)}
.btn .ic{width:1.1rem;height:1.1rem}
.btn.pri{background:var(--tx);color:var(--inv);border-color:var(--tx)}
.btn.ac{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.dg{color:var(--dg);border-color:var(--dg);background:transparent}
.btn.full{width:100%}
.btns{display:flex;gap:.5rem;flex-wrap:wrap}
.srch{display:flex;gap:.4rem;align-items:center;padding:.1rem 1.25rem .5rem}
.inp{width:100%;height:2.6rem;padding:0 .8rem;border-radius:var(--r);border:.5px solid var(--ln2);background:var(--bg2);outline:none}
.inp:focus{border-color:var(--ac)}
textarea.inp{height:auto;min-height:6rem;padding:.6rem .8rem;resize:vertical;line-height:1.6;display:block}
.rp{position:relative;overflow:hidden}
.rpl{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);animation:rpl .5s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(1);opacity:0}}
.ov{position:fixed;inset:0;z-index:100}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .25s}
.ov.in .scrim{opacity:1}.ov.out .scrim{opacity:0}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:90dvh;background:var(--bg2);border-radius:16px 16px 0 0;border-top:.5px solid var(--ln2);display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s var(--spring);padding-bottom:calc(env(safe-area-inset-bottom) + var(--kb))}
.ov.in .sheet{transform:none}
.ov.out .sheet{transform:translateY(100%);transition:transform .22s ease-in}
.sheet.full{height:92dvh}
.grab{display:flex;justify-content:center;padding:.6rem 0 .35rem;cursor:grab;touch-action:none;flex:none}
.grab span{width:2.4rem;height:4px;border-radius:2px;background:var(--ln2)}
.sh-h{padding:.1rem 1.25rem .7rem;font-weight:500;font-size:1rem;display:flex;align-items:center;gap:.5rem;flex:none}
.sh-b{overflow:auto;padding:0 1.25rem 1.25rem;overscroll-behavior:contain;flex:1}
.dlg{position:absolute;left:50%;top:50%;width:min(88vw,380px);transform:translate(-50%,-46%) scale(.96);opacity:0;background:var(--bg2);border:.5px solid var(--ln2);border-radius:14px;padding:1.25rem;transition:all .22s var(--ease)}
.ov.in .dlg{opacity:1;transform:translate(-50%,-50%)}.ov.out .dlg{opacity:0}
.dlg h3{margin:0 0 .4rem;font-size:1.02rem;font-weight:500}
.dlg p{margin:0 0 1.1rem;color:var(--sub);font-size:.88rem;white-space:pre-wrap}
.acts{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(82vw,300px);background:var(--bg2);border-right:.5px solid var(--ln2);transform:translateX(-100%);transition:transform .38s var(--spring);padding:calc(1rem + env(safe-area-inset-top)) .75rem 1rem;display:flex;flex-direction:column;gap:.1rem}
.ov.in .drawer{transform:none}.ov.out .drawer{transform:translateX(-100%);transition:transform .2s ease-in}
.drawer .brand{flex:none;padding:.4rem .75rem 1rem;margin:0}
.nav{display:flex;align-items:center;gap:.8rem;padding:.75rem;border-radius:10px;font-size:.95rem;text-align:left;width:100%}
.nav.on{background:var(--bg3)}
.nav .n{margin-left:auto;font-size:.72rem;color:var(--sub)}
.menu{position:absolute;min-width:210px;background:var(--bg2);border:.5px solid var(--ln2);border-radius:12px;padding:.3rem;transform:scale(.88);opacity:0;transition:transform .22s var(--spring),opacity .15s}
.ov.in .menu{transform:none;opacity:1}.ov.out .menu{opacity:0;transform:scale(.95)}
.mi{display:flex;align-items:center;gap:.7rem;width:100%;padding:.65rem .75rem;border-radius:8px;font-size:.9rem;text-align:left}
.mi .ic{width:1.1rem;height:1.1rem;color:var(--sub)}
.mi.dg,.mi.dg .ic{color:var(--dg)}
.mi:active{background:var(--bg3)}
.msep{height:.5px;background:var(--ln);margin:.3rem .4rem}
#toasts{position:fixed;left:0;right:0;bottom:calc(5.6rem + env(safe-area-inset-bottom) + var(--kb));z-index:200;display:flex;flex-direction:column;align-items:center;gap:.4rem;pointer-events:none;padding:0 1rem}
.toast{pointer-events:auto;display:flex;align-items:center;gap:.8rem;max-width:520px;width:100%;background:var(--tx);color:var(--inv);font-size:.82rem;padding:.7rem .9rem;border-radius:var(--r);transform:translateY(10px);opacity:0;transition:all .25s var(--ease)}
.toast.in{transform:none;opacity:1}
.toast button{color:var(--ac);font-weight:500;margin-left:auto;font-size:.82rem;flex:none;padding:.2rem .3rem}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:300;width:100vw;height:100vh}
.reveal{position:fixed;inset:0;z-index:400;pointer-events:none}
html.rm *,html.rm *::before,html.rm *::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
html.vt-theme::view-transition-old(root),html.vt-theme::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-group(*){animation-duration:.34s;animation-timing-function:cubic-bezier(.2,.7,.2,1)}
/* editor */
.savest{font-size:.66rem;color:var(--sub);margin-left:.2rem;white-space:nowrap}
.savest.err{color:var(--dg)}
.ed-head{padding:.2rem 1.25rem 0}
.ed-title{width:100%;font-size:1.5rem;font-weight:500;border:0;background:transparent;outline:none;padding:.2rem 0;letter-spacing:-.01em}
.ed-title::placeholder{color:var(--sub);opacity:.7}
.ed-meta{display:flex;align-items:center;gap:.5rem;font-size:.68rem;color:var(--sub);padding:.2rem 0 .7rem;border-bottom:.5px solid var(--ln);flex-wrap:wrap}
.segc{display:inline-flex;border:.5px solid var(--ln2);border-radius:8px;overflow:hidden;margin-left:auto}
.segc button{padding:.32rem .7rem;font-size:.72rem;color:var(--sub)}
.segc button.on{background:var(--tx);color:var(--inv)}
.ed-wrap{display:grid;grid-template-columns:minmax(0,1fr)}
.outline{padding:.5rem 1.25rem 1rem}
.nd{display:flex;align-items:flex-start;gap:.2rem;padding:.12rem 0;position:relative;border-radius:8px}
.car{width:1.4rem;height:2rem;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none;transition:transform .2s var(--ease)}
.car .ic{width:.95rem;height:.95rem}
.car.closed{transform:rotate(-90deg)}
.car.none{visibility:hidden}
.hd{width:1.5rem;height:2rem;display:flex;align-items:center;justify-content:center;color:var(--sub);flex:none;touch-action:none;cursor:grab}
.hd .ic{width:1rem;height:1rem}
.lb{font-family:var(--mono);font-size:.6rem;color:var(--sub);border:.5px solid var(--ln2);border-radius:4px;padding:0 .3rem;margin-top:.5rem;flex:none;white-space:nowrap;line-height:1.5}
.lb.d0{color:var(--ac);border-color:var(--ac)}
.tx{flex:1;min-width:0;outline:none;padding:.3rem .35rem;border-radius:6px;font-size:.95rem;line-height:1.55;word-break:break-word;min-height:2rem}
.tx:focus{background:var(--bg3)}
.tx:empty::before{content:attr(data-ph);color:var(--sub);opacity:.75}
.nd.d0 .tx{font-weight:500;font-size:1.02rem}
.nd.drag{background:var(--bg3);z-index:5;transition:none}
.nd.hit{animation:hit .9s ease}
@keyframes hit{0%{background:color-mix(in srgb,var(--ac) 25%,transparent)}100%{background:transparent}}
.addrow{display:flex;align-items:center;gap:.4rem;color:var(--sub);font-size:.82rem;padding:.6rem .2rem}
.addrow .ic{width:1rem;height:1rem}
.nodebar{position:fixed;left:0;right:0;bottom:var(--kb);z-index:60;display:flex;background:var(--bg2);border-top:.5px solid var(--ln2);padding:.2rem .25rem calc(.2rem + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s var(--ease)}
.nodebar:not(.on){visibility:hidden;transition:transform .25s var(--ease),visibility 0s .25s}
.nodebar.on{transform:none}
.nodebar button{flex:1;height:2.9rem;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:.56rem;color:var(--sub);gap:1px}
.nodebar button .ic{color:var(--tx);width:1.15rem;height:1.15rem}
.nodebar button.dgb .ic{color:var(--dg)}
.panel{background:var(--bg2)}
.phd{display:flex;align-items:center;gap:.3rem;padding:.2rem .75rem .2rem 1.25rem;flex:none}
.phd .t{font-size:.72rem;color:var(--sub);flex:1}
.pbody{padding:0 1.25rem 2rem}
.psec{padding:.9rem 0;border-bottom:.5px solid var(--ln)}
.pt{font-size:.68rem;color:var(--sub);font-family:var(--mono);margin-bottom:.5rem;display:flex;align-items:center;gap:.3rem}
.chk{display:flex;align-items:center;gap:.6rem;padding:.35rem 0;font-size:.88rem}
.chk input{width:1.1rem;height:1.1rem;accent-color:var(--ac);flex:none}
.help{width:1.4rem;height:1.4rem;display:inline-flex;align-items:center;justify-content:center;color:var(--sub);vertical-align:middle}
.help .ic{width:.95rem;height:.95rem}
.rv{padding:.6rem 0;border-bottom:.5px solid var(--ln);font-size:.8rem;display:flex;gap:.5rem;align-items:flex-start;width:100%;text-align:left}
.rv:last-child{border-bottom:0}
.rv .d{font-family:var(--mono);font-size:.66rem;color:var(--sub);flex:none;margin-top:.1rem}
.rv .x{flex:1;color:var(--sub);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media(min-width:900px){
 .ed-wrap{grid-template-columns:minmax(0,1fr) 330px}
 .ed-wrap.pcc{grid-template-columns:minmax(0,1fr)}
 .ed-wrap.pcc .panel{display:none}
 .panel{position:sticky;top:3.7rem;height:calc(100dvh - 3.7rem);overflow:auto;border-left:.5px solid var(--ln);background:var(--bg)}
 .pgrab{display:none}
}
@media(max-width:899px){
 .panel{position:fixed;left:0;right:0;bottom:0;z-index:70;height:52dvh;border-radius:16px 16px 0 0;border-top:.5px solid var(--ln2);transform:translateY(105%);transition:transform .4s var(--spring),height .35s var(--ease);display:flex;flex-direction:column;max-width:760px;margin:0 auto}
 .panel[data-s=half]{transform:none}
 .panel[data-s=full]{transform:none;height:90dvh}
 .panel .pbody{overflow:auto;flex:1;overscroll-behavior:contain}
 .panel .pclose-pc{display:none}
}
.v-editor-focus .top>*:not(.keep){display:none}
.v-editor-focus .ed-meta{display:none}
.v-editor-focus .ed-wrap{grid-template-columns:minmax(0,1fr)!important}
.v-editor-focus .panel{display:none}
.fexit{display:none}
.v-editor-focus .fexit{display:inline-flex;margin-left:auto}
.treewrap{overflow:auto;padding:1rem 1.25rem 3rem}
.zoom{display:flex;gap:.2rem;align-items:center;padding:.5rem 1.25rem 0;font-size:.7rem;color:var(--sub)}
.zoom .ib{width:2.2rem;height:2.2rem}
.tvroot{transform-origin:0 0;display:inline-block;transition:transform .2s var(--ease)}
.tn{display:flex;align-items:center}
.tbx{border:.5px solid var(--ln2);background:var(--bg2);border-radius:6px;padding:.35rem .6rem;font-size:.8rem;max-width:13rem;min-width:4.5rem;text-align:left;line-height:1.45;flex:none}
.tbx .tl{display:block;font-family:var(--mono);font-size:.56rem;color:var(--sub)}
.tbx.d0{border-color:var(--ac)}
.tbx .more{font-family:var(--mono);font-size:.6rem;color:var(--ac);margin-left:.3rem}
.tbx .emp{color:var(--sub)}
.tk{display:flex;flex-direction:column;padding-left:1.2rem;position:relative}
.tk::before{content:'';position:absolute;left:0;top:50%;width:1.2rem;border-top:1px solid var(--ln2)}
.tk>.tn{position:relative;padding:.22rem 0 .22rem .7rem}
.tk>.tn::before{content:'';position:absolute;left:0;top:50%;width:.7rem;border-top:1px solid var(--ln2)}
.tk>.tn::after{content:'';position:absolute;left:0;top:0;bottom:0;border-left:1px solid var(--ln2)}
.tk>.tn:first-child::after{top:50%}
.tk>.tn:last-child::after{bottom:50%}
.tk>.tn:only-child::after{display:none}
pre.md{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:.7rem;background:var(--bg3);border-radius:8px;padding:.8rem;max-height:13rem;overflow:auto;margin:.6rem 0;line-height:1.6}
.lbl{font-size:.72rem;color:var(--sub);margin:.9rem 0 .4rem;display:block}
/* settings */
.sec{padding:0 1.25rem}
.sec h2{font-size:.66rem;font-family:var(--mono);color:var(--sub);font-weight:400;margin:1.5rem 0 .1rem;letter-spacing:.08em}
.srow{display:flex;align-items:center;gap:.8rem;padding:.8rem 0;border-bottom:.5px solid var(--ln);width:100%;text-align:left;font-size:.92rem;min-height:3.2rem}
.srow .sl{flex:1;min-width:0}
.srow small{display:block;color:var(--sub);font-size:.72rem;line-height:1.5}
.srow .sv{margin-left:auto;color:var(--sub);font-size:.78rem;display:flex;align-items:center;gap:.2rem;flex:none}
.srow .sv .ic{width:1rem;height:1rem}
.srow.dgr{color:var(--dg)}
.tg{width:2.7rem;height:1.55rem;border-radius:1rem;background:var(--ln2);position:relative;flex:none;transition:background .2s}
.tg::after{content:'';position:absolute;top:.17rem;left:.17rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;transition:transform .28s var(--spring)}
.tg.on{background:var(--ac)}.tg.on::after{transform:translateX(1.15rem)}
.seg{display:inline-flex;border:.5px solid var(--ln2);border-radius:8px;overflow:hidden;flex:none}
.seg button{padding:.35rem .6rem;font-size:.74rem;color:var(--sub)}
.seg button.on{background:var(--tx);color:var(--inv)}
.sws{display:flex;gap:.5rem;flex:none}
.swc{width:1.7rem;height:1.7rem;border-radius:6px;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--ln2)}
.swc.on{box-shadow:0 0 0 2px var(--tx)}
/* drill */
.dq{padding:.6rem 1.25rem}
.qn{font-size:.72rem;color:var(--sub);display:flex;gap:.6rem;align-items:center}
.qt{font-size:1.02rem;margin:.7rem 0 1.1rem;line-height:1.75;white-space:pre-wrap}
.ch{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;padding:.85rem .9rem;border:.5px solid var(--ln2);border-radius:10px;margin-bottom:.5rem;font-size:.9rem;background:var(--bg2);transition:border-color .2s,background .2s}
.ch .k{font-family:var(--mono);font-size:.72rem;color:var(--sub);margin-top:.12rem;flex:none}
.ch.ok{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,var(--bg2))}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.8rem 0}

.bars{display:flex;align-items:flex-end;gap:4px;height:5rem;margin-top:.6rem;border-bottom:.5px solid var(--ln2)}

.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}

.slide{flex:0 0 100%;scroll-snap-align:center;padding:4rem 2rem 2rem;display:flex;flex-direction:column;justify-content:center;max-width:100vw}
.slide .k{font-family:var(--mono);font-size:.75rem;color:var(--ac);margin-bottom:1rem}

.dots{display:flex;gap:6px;justify-content:center;padding:1rem}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--ln2);transition:width .25s var(--ease),background .25s}
.dots i.on{width:18px;background:var(--tx)}

.kp{display:grid;grid-template-columns:repeat(3,4.3rem);gap:.9rem}

<script>
'use strict';
/* ===== 基本情報 ===== */
const APP={name:'ロジトレ',version:'検討中(ver未確定)',build:'trial-3',key:'logitore.v1'};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dk=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pad2=n=>String(n).padStart(2,'0');
function rel(t){const s=(Date.now()-t)/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<604800)return Math.floor(s/86400)+'d';return Math.floor(s/604800)+'w'}
function fdate(t){const d=new Date(t);return d.getFullYear()+'/'+pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes())}
const coarse=matchMedia('(pointer:coarse)').matches;
const wide=()=>innerWidth>=900;

/* ===== アイコン ===== */
const ICONS={menu:'M4 7h16M4 12h16M4 17h16',search:'M10 4a6 6 0 1 0 0 12a6 6 0 1 0 0-12zM20 20l-5.6-5.6',sun:'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4',moon:'M12 3a6 6 0 0 0 9 9a9 9 0 1 1-9-9z',plus:'M12 5v14M5 12h14',chevr:'M9 6l6 6-6 6',chevl:'M15 6l-6 6 6 6',chevd:'M6 9l6 6 6-6',pin:'M15 4.5l-4 4-4 1.5-1.5 1.5 7 7 1.5-1.5 1.5-4 4-4M9 15l-4.5 4.5M14.5 4l5.5 5.5',dots:'M12 5h.01M12 12h.01M12 19h.01',undo:'M9 14l-4-4 4-4M5 10h11a4 4 0 0 1 0 8h-1',redo:'M15 14l4-4-4-4M19 10H8a4 4 0 0 0 0 8h1',panel:'M4 5h16v14H4zM15 5v14',tree:'M4 5h6v4H4zM14 15h6v4h-6zM14 9h6v4h-6zM7 9v8h7M7 11h7',x:'M6 6l12 12M18 6L6 18',trash:'M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3',copy:'M8 8h12v12H8zM16 8V4H4v12h4',check:'M5 12l5 5L20 7',alert:'M12 8v4M12 16h.01M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z',download:'M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2M7 11l5 5 5-5M12 4v12',upload:'M4 17v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2M7 9l5-5 5 5M12 4v12',share:'M6 10a2 2 0 1 1 0 4a2 2 0 1 1 0-4zM18 4a2 2 0 1 1 0 4a2 2 0 1 1 0-4zM18 16a2 2 0 1 1 0 4a2 2 0 1 1 0-4zM7.8 11.1l8.4-4.2M7.8 12.9l8.4 4.2',ai:'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z',focus:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',up:'M12 19V5M6 11l6-6 6 6',down:'M12 5v14M6 13l6 6 6-6',indent:'M4 6h16M11 12h9M4 18h16M4 10l3 2-3 2',outdent:'M4 6h16M11 12h9M4 18h16M7 10l-3 2 3 2',grip:'M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01',sort:'M4 7h10M4 12h7M4 17h4M17 5v14M14 16l3 3 3-3',help:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.6M12 17h.01',target:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 12h.01',home:'M4 11l8-7 8 7M6 9.5V20h12V9.5',sliders:'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',book:'M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM5 18a2 2 0 0 1 2-2h12M9 8h6',lock:'M6 11h12v9H6zM8 11V8a4 4 0 0 1 8 0v3',image:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15 9h.01',list:'M9 6h11M9 12h11M9 18h11M5 6h.01M5 12h.01M5 18h.01',refresh:'M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6',enter:'M19 6v5a3 3 0 0 1-3 3H6M10 10l-4 4 4 4',child:'M6 4v10a3 3 0 0 0 3 3h9M14 13l4 4-4 4',flag:'M5 21V4h11l-2 4 2 4H5',info:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 11v5M12 8h.01'};
const BOLD=new Set(['dots','grip']);
function I(n){return `<svg class="ic${BOLD.has(n)?' b':''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]||''}"/></svg>`}

/* ===== 保存 ===== */
let S=null; const pendingErr=[];
function defState(){return{schema:1,thoughts:[],trash:[],settings:{theme:'dark',accent:'#378ADD',font:1,reduceMotion:matchMedia('(prefers-reduced-motion: reduce)').matches,backConfirm:true,pinOn:false,pin:null,backupDays:7,pcPanel:true},drill:{days:{},streak:0,lastDone:null,total:0,correct:0,today:null},errors:[],meta:{created:Date.now(),lastExport:null,firstThoughtAt:null,onboarded:false,last:null}}}
function migrate(s){const d=defState();if(!s||typeof s!=='object')return d;const fixT=t=>{if(t&&t.template==='tree')t.template='why';if(t&&!TPL[t.template])t.template='blank'};(s.thoughts||[]).forEach(fixT);(s.trash||[]).forEach(fixT);for(const k of Object.keys(d)){if(s[k]===undefined)s[k]=d[k];else if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])){for(const kk of Object.keys(d[k]))if(s[k][kk]===undefined)s[k][kk]=d[k][kk]}}return s}
const Store={ok:true,
 load(){let raw=null;try{raw=localStorage.getItem(APP.key)}catch(e){this.ok=false;pendingErr.push(e)}
  try{S=migrate(raw?JSON.parse(raw):null)}catch(e){pendingErr.push(new Error('保存データの読み込みに失敗: '+e.message));S=defState()}},
 save(){try{localStorage.setItem(APP.key,JSON.stringify(S));this.ok=true;return true}catch(e){this.ok=false;try{S.errors.unshift({t:Date.now(),msg:'保存に失敗しました: '+(e.message||e),ctx:'save',stack:'',seen:false});S.errors=S.errors.slice(0,50)}catch(_){}return false}}};
let saveT=null;
function dirty(){setSaveState('saving');clearTimeout(saveT);saveT=setTimeout(flush,700)}
function flush(){clearTimeout(saveT);saveT=null;if(!S)return;const ok=Store.save();setSaveState(ok?'saved':'error');if(!ok)toast('保存できませんでした。書き出しでバックアップしてください')}
function setSaveState(s){const el=$('#savest');if(!el)return;el.classList.toggle('err',s==='error');el.textContent=s==='saving'?'保存中…':s==='error'?'保存失敗':'✓ 保存済み'}

/* ===== エラーログ ===== */
let errBusy=false;
function logError(err,ctx){try{const e={t:Date.now(),msg:String((err&&err.message)||err||'不明なエラー'),ctx:ctx||'',stack:String((err&&err.stack)||'').split('\n').slice(0,4).join(' | '),seen:false};if(!S){pendingErr.push(err);return}S.errors.unshift(e);S.errors=S.errors.slice(0,50);if(!errBusy){errBusy=true;Store.save();errBusy=false}toast('エラーが発生しました(ログに保存しました)')}catch(_){}}
addEventListener('error',e=>logError(e.error||e.message,'画面'));
addEventListener('unhandledrejection',e=>logError(e.reason,'非同期処理'));

/* ===== 演出 ===== */
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.rp');if(!el||S&&S.settings.reduceMotion)return;const r=el.getBoundingClientRect();const d=Math.max(r.width,r.height)*2;const s=document.createElement('span');s.className='rpl';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;el.appendChild(s);s.addEventListener('animationend',()=>s.remove())},{passive:true});
function shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');try{navigator.vibrate&&navigator.vibrate(30)}catch(_){}}
function confetti(){if(S.settings.reduceMotion)return;const c=$('#fx'),x=c.getContext('2d'),dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);const cs=getComputedStyle(document.documentElement);const cols=[cs.getPropertyValue('--ac').trim()||'#378ADD',cs.getPropertyValue('--tx').trim(),cs.getPropertyValue('--sub').trim()];const P=Array.from({length:90},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*11-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.35,w:5+Math.random()*5,h:3+Math.random()*4,c:cols[Math.floor(Math.random()*3)]}));const t0=performance.now();(function f(t){const k=t-t0;x.clearRect(0,0,innerWidth,innerHeight);for(const p of P){p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.max(0,1-k/1700);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}if(k<1700)requestAnimationFrame(f);else x.clearRect(0,0,innerWidth,innerHeight)})(t0)}

/* ===== トースト ===== */
function toast(msg,o={}){const box=$('#toasts');if(!box)return;const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`<span>${esc(msg)}</span>`+(o.action?`<button>${esc(o.action.label)}</button>`:'');box.appendChild(t);while(box.children.length>2)box.firstChild.remove();requestAnimationFrame(()=>t.classList.add('in'));const kill=()=>{t.classList.remove('in');setTimeout(()=>t.remove(),260)};if(o.action)t.querySelector('button').onclick=()=>{kill();o.action.fn()};const ms=o.ms===undefined?(o.action?4500:2200):o.ms;if(ms)setTimeout(kill,ms);return kill}

/* ===== 戻る操作(CloseWatcher+履歴) ===== */
const Back={stack:[],hasCW:typeof window.CloseWatcher==='function',ignore:0,
 open(onClose){const h={onClose,closed:false,w:null,hist:false};if(this.hasCW){try{h.w=new CloseWatcher();h.w.onclose=()=>{if(h.closed)return;h.closed=true;this.remove(h);onClose()}}catch(e){h.w=null}}if(!h.w){history.pushState({ov:1},'');h.hist=true}this.stack.push(h);return h},
 remove(h){const i=this.stack.indexOf(h);if(i>=0)this.stack.splice(i,1)},
 close(h){if(!h||h.closed)return;h.closed=true;this.remove(h);if(h.w){try{h.w.destroy()}catch(_){}}else if(h.hist){this.ignore++;history.back()}}};
const Nav={view:null,vw:null,armed:false,at:null,rt:null,mode:(typeof window.CloseWatcher==='function'&&coarse)?'cw':'hist',
 setup(){if(this.mode!=='cw')return;if(this.vw){const w=this.vw;this.vw=null;try{w.destroy()}catch(_){}}
  if(this.view==='home'&&!S.settings.backConfirm)return;
  try{const w=new CloseWatcher();this.vw=w;
   w.oncancel=e=>{if(!e.cancelable)return;if(this.view==='home'){e.preventDefault();this.exitHint(w)}else if(this.view==='editor'&&S.settings.backConfirm&&!this.armed){e.preventDefault();this.arm()}};

function findNode(root,id,parent=null,depth=0){if(root.id===id)return{node:root,parent,depth,idx:parent?parent.children.indexOf(root):0};for(const c of root.children){const r=findNode(c,id,root,depth+1);if(r)return r}return null}
function walk(n,f,d=0){f(n,d);n.children.forEach(c=>walk(c,f,d+1))}
function fullText(t){let s=t.title+' '+t.memo;walk(t.root,n=>{s+=' '+n.text});return s}
function titleOf(t){return t.title.trim()||t.root.text.trim()||'無題の思考'}
function isEmptyT(t){let e=!t.title.trim()&&!t.memo.trim()&&!t.reviews.length;const preset=t.template==='pros'?['メリット','デメリット']:[];walk(t.root,n=>{const x=n.text.trim();if(x&&!preset.includes(x))e=false});return e}
function cloneNodes(n){return{...n,id:uid(),children:n.children.map(cloneNodes)}}
function newThought(tpl,o={}){const now=Date.now();const t={id:uid(),title:o.title||'',template:tpl,status:'draft',pinned:false,created:now,updated:now,root:o.root||TPL[tpl].make(),memo:o.memo||'',mece:{a:false,b:false,c:false},reviews:[]};S.thoughts.unshift(t);S.meta.firstThoughtAt=S.meta.firstThoughtAt||now;dirty();requestPersist();return t}
function getT(id){return S.thoughts.find(t=>t.id===id)}
function dupThought(id){const t=getT(id);if(!t)return;const n=JSON.parse(JSON.stringify(t));n.id=uid();n.title=titleOf(t)+' のコピー';n.root=cloneNodes(n.root);n.created=n.updated=Date.now();n.pinned=false;S.thoughts.unshift(n);dirty();toast('複製しました');if(Nav.view==='home')renderHome(false)}

function toMarkdown(t,kind){const lines=[];if(kind)lines.push(PROMPTS[kind][1],'');lines.push('## 思考: '+titleOf(t),`- 型: ${tpl(t).name}`,`- 状態: ${STATUS[t.status]}`,'','### 構造');walk(t.root,(n,d)=>lines.push(`${'  '.repeat(d)}- [${labelOf(t,n,d)}] ${n.text.trim()||'(未入力)'}`));if(t.memo.trim())lines.push('','### メモ',t.memo.trim());return lines.join('\n')}
function openAI(){const t=T();let kind='strict';const s=sheet(`<div class="seg" id="ai-k" style="display:flex;width:100%">${Object.entries(PROMPTS).map(([k,[l]])=>`<button data-k="${k}" class="${k===kind?'on':''}" style="flex:1">${l}</button>`).join('')}</div><pre class="md" id="ai-md"></pre><div class="btns"><button class="btn ac" id="ai-copy">${I('copy')}コピー</button>${navigator.share?`<button class="btn" id="ai-share">${I('share')}共有</button>`:''}</div><span class="lbl">コピーした文章をClaudeなどのAIチャットに貼り付けて送信します。返ってきた答えは下に貼り付けて保存できます。</span><textarea class="inp" id="ai-res" placeholder="AIの返答をここに貼り付け"></textarea><div style="margin-top:.6rem"><button class="btn pri full" id="ai-save">${I('check')}返答を保存</button></div>`,{title:'AIに提出'});
 const upd=()=>{$('#ai-md',s.el).textContent=toMarkdown(t,kind)};upd();
 $$('#ai-k button',s.el).forEach(b=>b.onclick=()=>{kind=b.dataset.k;$$('#ai-k button',s.el).forEach(x=>x.classList.toggle('on',x===b));upd()});
 $('#ai-copy',s.el).onclick=()=>copyText(toMarkdown(t,kind),'AI用にコピーしました');
 const sh=$('#ai-share',s.el);if(sh)sh.onclick=()=>navigator.share({title:titleOf(t),text:toMarkdown(t,kind)}).catch(e=>{if(e&&e.name!=='AbortError')logError(e,'共有')});
 $('#ai-save',s.el).onclick=()=>{const v=$('#ai-res',s.el).value.trim();if(!v){shake($('#ai-res',s.el));toast('返答を貼り付けてから保存してください');return}t.reviews.unshift({t:Date.now(),kind:PROMPTS[kind][0],text:v});touch();s.close();renderPanel();toast('AIの返答を保存しました')}}
async function copyText(s,msg='コピーしました'){try{await navigator.clipboard.writeText(s);toast(msg)}catch(_){const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(__){}ta.remove();toast(ok?msg:'コピーできませんでした。手動で選択してください')}}
/* 画像で書き出し */
function exportPng(){const t=T();const dark=resolved()==='dark';const c=document.createElement('canvas');const x=c.getContext('2d');const W=1080,P=64,LH=46,F='system-ui,"Hiragino Sans","Noto Sans JP",sans-serif',M='ui-monospace,Menlo,monospace';const rows=[];walk(t.root,(n,d)=>rows.push({n,d}));
 const wrap=(s,w)=>{x.font=`30px ${F}`;const out=[];let line='';for(const ch of s){if(x.measureText(line+ch).width>w){out.push(line);line=ch}else line+=ch}out.push(line);return out};
 const L=rows.map(r=>{const lb=labelOf(t,r.n,r.d);x.font=`20px ${M}`;const lw=x.measureText(lb).width+20;const ind=P+r.d*44;return{...r,lb,lw,ind,lines:wrap(r.n.text.trim()||'(未入力)',W-ind-lw-16-P)}});
 const H=P+60+40+40+L.reduce((a,r)=>a+r.lines.length*LH+14,0)+P;c.width=W;c.height=H;
 x.fillStyle=dark?'#1A1C21':'#ECEEF2';x.fillRect(0,0,W,H);const tx=dark?'#DDE0E6':'#262A31',sub=dark?'#959BA7':'#6A717E',ln=dark?'#454A54':'#C8CDD5',ac=S.settings.accent;
 x.textBaseline='top';x.fillStyle=tx;x.font=`500 44px ${F}`;x.fillText(titleOf(t).slice(0,40),P,P);x.fillStyle=sub;x.font=`20px ${M}`;x.fillText(`${tpl(t).code} · ${STATUS[t.status]} · ${fdate(t.updated)}`,P,P+64);
 let y=P+60+40+40;for(const r of L){x.strokeStyle=r.d===0?ac:ln;x.lineWidth=1.5;x.strokeRect(r.ind,y+6,r.lw,28);x.fillStyle=r.d===0?ac:sub;x.font=`20px ${M}`;x.fillText(r.lb,r.ind+10,y+10);x.fillStyle=tx;x.font=`${r.d===0?'500 ':''}30px ${F}`;r.lines.forEach((l,i)=>x.fillText(l,r.ind+r.lw+16,y+i*LH));y+=r.lines.length*LH+14}
 x.fillStyle=sub;x.font=`18px ${M}`;x.fillText('logitore',W-P-90,H-P+20);
 c.toBlob(b=>{if(!b)return toast('画像を作れませんでした');download(b,`logitore_${titleOf(t).slice(0,20).replace(/[\\/:*?"<>|\s]/g,'_')}.png`);toast('画像を書き出しました')},'image/png')}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

function rng(seed){let a=0;for(const ch of String(seed))a=(a*31+ch.charCodeAt(0))|0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let DS=null;

 const segs=`<div class="segs" style="margin:0 1.25rem">${DS.qs.map((_,i)=>`<i class="${i<DS.res.length?(DS.res[i]?'ok':'ng'):''}"></i>`).join('')}</div>`;
 if(DS.pos>=DS.qs.length){const c=DS.res.filter(Boolean).length;v.innerHTML=head+segs+`<div class="dq"><div class="qn mono">RESULT</div><div class="qt" style="font-size:1.5rem;font-weight:500">${DS.qs.length}問中 ${c}問 正解</div><p style="color:var(--sub);font-size:.88rem;margin-top:-.4rem">${c===DS.qs.length?'全問正解です。':c>=3?'良い調子です。解説を見直すとさらに定着します。':'間違えた問題の解説を読み返してみましょう。'}</p><div class="btns" style="margin:1rem 0"><button class="btn ac" id="d-more">${I('refresh')}もっと練習する</button><button class="btn" id="d-home">ホームへ</button></div>${statsHtml()}</div>`;$('#d-more').onclick=()=>{startPractice();renderDrill()};$('#d-home').onclick=()=>go('home')}
 else{const qi=DS.qs[DS.pos],q=Q[qi],ord=orderFor(qi);DS.ord=ord;v.innerHTML=head+segs+`<div class="dq" id="d-card"><div class="qn mono"><span>Q${DS.pos+1}/${DS.qs.length}</span><span>·</span><span>${esc(q.tag)}</span></div><div class="qt">${esc(q.q)}</div><div id="d-ch">${ord.map((ci,i)=>`<button class="ch rp" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${esc(q.c[ci])}</span></button>`).join('')}</div><div id="d-after"></div></div>`;$$('.ch',v).forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
 $('#d-back').onclick=()=>go('home')}
function statsHtml(){const d=S.drill;const rate=d.total?Math.round(d.correct/d.total*100):0;const days=[...Array(14)].map((_,i)=>dk(i-13));return`<div class="stats"><div class="stat"><b>${d.total}</b><span>解いた問題</span></div><div class="stat"><b>${rate}%</b><span>正答率</span></div><div class="stat"><b>${curStreak()}</b><span>連続日数</span></div></div><div class="pt" style="margin-top:1rem">直近14日の正答率</div><div class="bars">${days.map(k=>{const x=d.days[k];const r=x&&x.n?x.c/x.n:0;return`<div class="${x&&x.n?'':'z'}" style="height:${x&&x.n?Math.max(6,Math.round(r*100)):3}%" title="${k}"></div>`}).join('')}</div><div class="blab">${days.map(k=>`<span>${+k.slice(8)}</span>`).join('')}</div>`}
function answer(i){if(DS.answered)return;DS.answered=true;const qi=DS.qs[DS.pos],q=Q[qi];const ok=DS.ord[i]===0;const bs=$$('.ch');bs.forEach((b,j)=>{if(DS.ord[j]===0)b.classList.add('ok');else if(j===i)b.classList.add('ng');else b.classList.add('dim')});
 DS.res.push(ok);S.drill.total++;if(ok)S.drill.correct++;

 if(!ok)shake($('#d-card'));const last=DS.pos+1>=DS.qs.length;

 $('#d-next').onclick=()=>{DS.pos++;DS.answered=false;if(DS.pos>=DS.qs.length&&DS.res.filter(Boolean).length>=3)setTimeout(confetti,150);renderDrill();scrollTo(0,0)};

async function hash(s){try{if(crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('logitore:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(_){}let h=0;for(const c of 'logitore:'+s)h=(h*31+c.charCodeAt(0))|0;return'w'+h}

 const api={el:w,close:()=>{w.style.opacity='0';setTimeout(()=>w.remove(),220);if(api.h){Back.close(api.h);api.h=null}},fail:()=>{v='';draw();shake($('.pdots',w))}};
 if(o.cancel){api.h=Back.open(()=>{api.h=null;api.close()});api.h.closeUI=api.close}
 $$('.kp button',w).forEach(b=>b.onclick=()=>{if(b.dataset.n!==undefined){if(v.length<4){v+=b.dataset.n;draw();if(v.length===4)setTimeout(()=>onDone(v,api),120)}}else if(b.dataset.f==='bs'){v=v.slice(0,-1);draw()}else if(b.dataset.f==='x'&&o.cancel)api.close()});
 const fg=$('#pin-forgot',w);if(fg)fg.onclick=o.forgot;return api}

function onboarding(again){const sl=[['01 / THINK','考えを「型」に流し込む','ロジックツリーやピラミッドなどの型を選び、課題を枝分かれさせて整理します。スマホではアウトライン、全体はツリーで確認できます。'],['02 / REVIEW','AIに提出して、穴を見つける','作った思考は、AIが読みやすい文章にワンタップで変換できます。Claudeなどに貼り付けて、論理の飛躍や根拠の弱さを指摘してもらいましょう。'],['03 / KEEP','データは、この端末の中に','思考は端末内に自動保存され、外部には送信されません。故障や機種変更に備えて、設定の「書き出し」で定期的にバックアップしてください。']];
